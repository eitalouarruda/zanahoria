name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzar el build a mano desde la pestaña Actions.
  workflow_dispatch:

# Un push nuevo cancela el build anterior de la misma rama, salvo en main:
# ahí cada push es una release y se deja terminar.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Start test databases
        run: docker compose up -d --wait
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
        env:
          ZANAHORIA_TEST_PG: postgres://zanahoria:zanahoria@localhost:55432/zanahoria
          ZANAHORIA_TEST_MYSQL: mysql://zanahoria:zanahoria@localhost:33306/zanahoria
          ZANAHORIA_TEST_MARIADB: mysql://zanahoria:zanahoria@localhost:33307/zanahoria
          ZANAHORIA_TEST_REDIS: redis://localhost:63790
      - name: Forbid openssl/native-tls in dependency tree
        run: |
          cd src-tauri
          # openssl-probe (Rust puro, solo localiza certificados) es inofensivo:
          # se buscan los crates que de verdad enlazan OpenSSL.
          if cargo tree -p db-core -e normal | grep -E '(^|[^a-z-])(openssl|openssl-sys|native-tls) v'; then
            echo "::error::db-core arrastra openssl/native-tls — rompe la compilación Android"
            exit 1
          fi

  # Cada push a main publica una release. La versión es MAJOR.MINOR de
  # tauri.conf.json + el número de ejecución: 0.1.57, 0.1.58, ...
  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Borrador hasta que todos los instaladores estén subidos.
          # El id sale de la misma respuesta: listar las releases justo
          # después de crearla puede no incluirla todavía.
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Zanahoria v$VERSION" -F draft=true \
            -F generate_release_notes=true --jq .id)
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: solo AppImage. Windows: instalador .exe (NSIS) y .msi.
          - platform: ubuntu-22.04
            args: "--bundles appimage"
          - platform: windows-latest
            args: "--bundles nsis,msi"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Sin `version`: usa la de "packageManager" en package.json (pnpm 11).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.release_id }}
      # linuxdeploy mete las libwayland de Ubuntu 22.04 en el AppImage; chocan
      # con el Mesa del host (distros recientes) y WebKit aborta con
      # "Could not create surfaceless EGL display: EGL_BAD_ALLOC". Se quitan y
      # se usa la del sistema, que siempre existe donde hay Wayland/Mesa.
      - name: Strip bundled libwayland from AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          img="src-tauri/target/release/bundle/appimage/Zanahoria_${VERSION}_amd64.AppImage"
          work="$(mktemp -d)"
          (cd "$work" && "$GITHUB_WORKSPACE/$img" --appimage-extract >/dev/null)
          rm -v "$work"/squashfs-root/usr/lib/libwayland-*.so*
          wget -q -O "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          ARCH=x86_64 "$work/appimagetool" --appimage-extract-and-run "$work/squashfs-root" "$img"
          gh release upload "v${VERSION}" "$img" --clobber --repo "${{ github.repository }}"

  # Publica la release solo si los dos builds terminaron bien.
  publish:
    needs: [release, build-desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.release.outputs.version }}" \
            --repo "${{ github.repository }}" --draft=false --latest
