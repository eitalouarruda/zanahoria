name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzar el build a mano desde la pestaña Actions.
  workflow_dispatch:

# Un push nuevo cancela el build anterior de la misma rama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Start test databases
        run: docker compose up -d --wait
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
        env:
          ZANAHORIA_TEST_PG: postgres://zanahoria:zanahoria@localhost:55432/zanahoria
          ZANAHORIA_TEST_MYSQL: mysql://zanahoria:zanahoria@localhost:33306/zanahoria
          ZANAHORIA_TEST_MARIADB: mysql://zanahoria:zanahoria@localhost:33307/zanahoria
          ZANAHORIA_TEST_REDIS: redis://localhost:63790
      - name: Forbid openssl/native-tls in dependency tree
        run: |
          cd src-tauri
          # openssl-probe (Rust puro, solo localiza certificados) es inofensivo:
          # se buscan los crates que de verdad enlazan OpenSSL.
          if cargo tree -p db-core -e normal | grep -E '(^|[^a-z-])(openssl|openssl-sys|native-tls) v'; then
            echo "::error::db-core arrastra openssl/native-tls — rompe la compilación Android"
            exit 1
          fi

  build-desktop:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      # Sin `version`: usa la de "packageManager" en package.json (pnpm 11).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: zanahoria-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
