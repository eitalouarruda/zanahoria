[package]
name = "app-store"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
db-core = { path = "../db-core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Linux: Secret Service (gnome-keyring / KWallet) persiste en disco; el
# keyring del kernel (linux-native) se pierde al reiniciar y solo se usa para
# migrar passwords guardados por versiones anteriores.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "linux-native", "windows-native", "apple-native"] }

[dev-dependencies]
tempfile = "3"
